apply plugin: 'com.android.application'

apply plugin: 'kotlin-android'

android {
    namespace 'com.bonstead.pitdroid'
    compileSdkVersion 34 // Updated from the old SDK

    defaultConfig {
        applicationId "com.bonstead.pitdroid"
        minSdkVersion 26 // A safe modern minimum
        targetSdkVersion 34 // Updated for Android 14
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    // Restore the BuildConfig generation required by the app's loggers
    buildFeatures {
        buildConfig = true
        viewBinding = true // <-- ADD THIS LINE
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // Modern Kotlin core
    implementation 'androidx.core:core-ktx:1.12.0'

    // Modern AndroidX and Material Design (replaces the old support libraries)
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Required for the modern Settings/Preferences screen
    implementation 'androidx.preference:preference-ktx:1.2.1'
}